services:
  ptrack:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - nscacert
    command: ["serve"]
    environment:
      PTRACK_HTTP_ADDRESS: 0.0.0.0:7777
      PTRACK_WEB_DIR: /app/web
    ports:
      - "7777:7777"
    develop:
      watch:
        - action: rebuild
          path: pnpm-lock.yaml
  ptrack-web-dev:
    profiles:
      - web-dev
    image: node:20-alpine
    working_dir: /workspace
    depends_on:
      - ptrack
    environment:
      CI: "true"
      NODE_EXTRA_CA_CERTS: /run/secrets/nscacert
      PTRACK_HTTP_ADDRESS: http://ptrack:7777
    command:
      - sh
      - -lc
      - corepack enable && pnpm install --frozen-lockfile --config.confirmModulesPurge=false && pnpm --filter ptrack-web exec vite --host 0.0.0.0 --port 7778
    ports:
      - "7778:7778"
    volumes:
      - .:/workspace
      - ptrack-node-modules:/workspace/node_modules
      - ptrack-pnpm-store:/root/.local/share/pnpm/store
    secrets:
      - nscacert
    develop:
      watch:
        - action: rebuild
          path: pnpm-lock.yaml

volumes:
  ptrack-node-modules:
  ptrack-pnpm-store:

secrets:
  nscacert:
    file: ${NSCACERT_PATH:-/Users/Shared/nscacert.pem}
