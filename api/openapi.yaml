openapi: 3.1.0
info:
  title: ptrack API
  version: 1.0.0
  description: |
    Canonical HTTP API contract for ptrack.
    Only commands launched with the `ptrack` prefix are tracked.
servers:
  - url: http://127.0.0.1:7777
paths:
  /api/v1/health:
    get:
      summary: Get daemon health
      responses:
        '200':
          description: Daemon health payload
  /api/v1/processes:
    get:
      summary: List tracked processes
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [all, running, exited]
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: cursor
          schema:
            type: string
      responses:
        '200':
          description: Process list
  /api/v1/processes/{id}:
    get:
      summary: Get tracked process detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Process detail
        '404':
          description: Not found
  /api/v1/processes/{id}/logs:
    get:
      summary: Get buffered logs
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: after
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: Buffered logs
  /api/v1/processes/{id}/children:
    get:
      summary: Get child process snapshot
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Child process snapshot
